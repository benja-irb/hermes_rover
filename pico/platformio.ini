; Hermes rover — Raspberry Pi Pico firmware
; Framework : Arduino (arduino-pico by Earle Philhower)
; Target     : RP2040

[env:pico]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
board            = rpipico2
framework        = arduino
board_build.core = earlephilhower
upload_protocol  = mbed
upload_port      = /Volumes/RP2350
monitor_speed    = 115200

; Expose the shared protocol header to all translation units
build_flags      =
    -I../common
    -std=gnu++17
    -Wall
    -Wextra

build_unflags    = -std=gnu++11
